name: Windows

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: dotnet test tests/ModelBar.Core.Tests -c Release

      - name: Publish
        run: |
          dotnet publish src/ModelBar.Gateway -c Release -r win-x64 -o dist/ModelBar
          dotnet publish src/ModelBar.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/ModelBar
          Remove-Item dist/ModelBar/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem dist/ModelBar | Format-Table Name, Length

      - name: Install real agents
        run: npm install -g @openai/codex opencode-ai @anthropic-ai/claude-code @earendil-works/pi-coding-agent @kilocode/cli

      - name: End-to-end test with real agents
        timeout-minutes: 15
        run: |
          dotnet build tools/ModelBar.DevCli -c Release
          python tests/smoke/smoke.py tools/ModelBar.DevCli/bin/Release/net10.0/ModelBar.DevCli.exe dist/ModelBar/ModelBarGateway.exe

      - name: Render screenshots
        if: always()
        timeout-minutes: 6
        run: |
          dotnet build src/ModelBar.App -c Release -p:DefineConstants=DEVSNAPSHOT -o snapshot-build
          python tests/smoke/seed_screens.py "$env:RUNNER_TEMP/screens-home"
          $env:MODELBAR_HOME = "$env:RUNNER_TEMP/screens-home"
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $output = Join-Path $PWD "screenshots"
          $process = Start-Process snapshot-build/ModelBar.exe -ArgumentList "--dev-snapshot", "`"$output`"" -PassThru
          $null = $process.Handle
          $finished = $process.WaitForExit(120000)
          if (-not $finished) { Stop-Process $process -Force }
          "exit code: $($process.ExitCode)"
          $crash = "$env:RUNNER_TEMP/screens-home/AppData/Roaming/ModelBar/logs/crash.log"
          if (Test-Path $crash) { Get-Content $crash; Copy-Item $crash screenshots/crash.log }
          Get-ChildItem screenshots | Format-Table Name, Length
          $count = (Get-ChildItem screenshots -Filter *.png | Measure-Object).Count
          if ($count -lt 10) { throw "expected 10 screenshots, got $count" }

      # 上面两步用的是另外编译的版本，这一步才真正启动安装包里的单文件程序。
      - name: Launch the packaged app
        if: always()
        timeout-minutes: 3
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Desktop($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $image = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($image)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $image.Save((Join-Path $PWD "screenshots/$name.png"))
            $graphics.Dispose()
            $image.Dispose()
          }
          function Assert-Healthy($process) {
            $crash = "$env:APPDATA/ModelBar/logs/crash.log"
            if (Test-Path $crash) { Get-Content $crash; Copy-Item $crash screenshots/packaged-crash.log; throw "packaged app reported a crash" }
            if ($process.HasExited) { throw "packaged app exited with code $($process.ExitCode)" }
          }
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $exe = (Resolve-Path dist/ModelBar/ModelBar.exe).Path
          $first = Start-Process $exe -PassThru
          $null = $first.Handle
          Start-Sleep 20
          Save-Desktop "desktop-first-run"
          Assert-Healthy $first
          # 第二次启动应该立刻退出，并让正在运行的实例弹出面板。
          $second = Start-Process $exe -PassThru
          $null = $second.Handle
          if (-not $second.WaitForExit(30000)) { throw "second launch did not exit" }
          Start-Sleep 5
          Save-Desktop "desktop-panel"
          Assert-Healthy $first
          Stop-Process $first -Force
          "packaged app ok"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: windows/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: ModelBar-win-x64
          path: windows/dist/ModelBar
